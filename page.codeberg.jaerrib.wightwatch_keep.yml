id: page.codeberg.jaerrib.wightwatch_keep
runtime: org.freedesktop.Platform
runtime-version: '25.08'
base: org.godotengine.godot.BaseApp
base-version: '4.7'
sdk: org.freedesktop.Sdk
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=input

modules:
  - name: wightwatchkeep
    buildsystem: simple

    sources:
      - type: git
        url: https://codeberg.org/jaerrib/wightwatch_keep.git
        tag: 1.6
        commit: b249bcf5b7af7257982ac50f6b327ef8bfaabaa2

      - type: file
        url: https://codeberg.org/jaerrib/wightwatch_keep/releases/download/1.6/Wightwatch_Keep-1.6.pck
        dest-filename: Wightwatch_Keep.pck
        sha256: 0f715f737cc505ee06a38df63bdfa4ec4241934cb754be5634b4b6d19b5f5ccc

    build-commands:
      - install -Dm644 Wightwatch_Keep.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
